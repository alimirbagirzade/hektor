[project]
name = "hektor-trader-ai"
version = "0.1.0"
description = "Local-first AI trading research system (RAG + knowledge cards + LoRA + backtest) for macOS Apple Silicon."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Hektor Trader AI" }]
keywords = ["trading", "research", "rag", "lora", "backtest", "local-first"]

dependencies = [
    # data
    "pandas>=2.2",
    "numpy>=1.26",
    # pyarrow: kodda dogrudan import edilmiyor; chromadb transitif isteyebilir -> birakildi
    "pyarrow>=16.0",
    # config / validation
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # storage
    "sqlalchemy>=2.0",
    "chromadb>=0.5",
    # pdf
    "pymupdf>=1.24",
    "pypdf>=4.2",
    # indikatorler ve backtest motoru el yazimi:
    # app/trading/indicators.py + app/trading/backtester.py (harici kutuphane kullanilmiyor)
    # cli / ux
    "typer>=0.12",
    "rich>=13.7",
    # LLM: YALNIZ yerel Ollama (httpx ile). Bulut SDK'leri (anthropic/google-genai)
    # bilinçli olarak YOK — pay-per-token API bu projede kullanılmaz.
    # io / web (paper sourcing)
    "requests>=2.32",
    "httpx>=0.27",
    # web server — hektor-web entry point (tüm platformlarda gerekli)
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    # system profiling (model recommendation)
    "psutil>=6.0",
]

[project.optional-dependencies]
# Heavier / platform-specific extras. mlx-lm only installs on Apple Silicon.
train = ["mlx-lm>=0.16; platform_system == 'Darwin' and platform_machine == 'arm64'"]
# Windows/Linux CPU veya CUDA ile LoRA egitimi icin: uv pip install -e ".[train-cpu]"
# NOT: HF `datasets` kullanilmiyor (bkz. app/training/peft_lora_train.py) — yerel datasets/ dizini
# kastedilir. `accelerate` dogrudan import edilmez ama transformers.Trainer runtime'da ister.
# transformers TABANI 5.16: `>=4.40` fazla gevsekti -- kilit 5.9.0'a cozulurken
# makineye 5.16.1 kuruluydu ve `uv sync` ortak bagimliliklari kilide cekince
# tokenizers 0.23.2 -> 0.22.2 dustu, `import transformers` kirildi (2026-09-09 ve
# 2026-09-11 03:00 gece gorevi; bkz. update.ps1 basligi). hektor_lora_v8_4b
# transformers 5.16.1 altinda egitildi; taban onu yansitir ki kilit ile kurulu
# ortam ayrisamasin. tokenizers ayrica pinlenmez -- transformers kendi araligini
# (>=0.23.1,<0.24) dayatir, cift boylece tek kaynaktan turer.
# Ust sinir <5.17 BILINCLI: hektor_lora_v8_4b 5.16.1 altinda egitildi VE
# degerlendirildi; kilit onu tutmazsa gece senkronu yigini 5.17'ye tasir ve ayni
# adapter'in skorlari yeniden uretilemez (Kural 6). Yukseltmek tek satirlik ACIK
# karardir; ardindan adapter yeniden degerlendirilmelidir.
# Digerleri de ayni gerekce ile sabit: kilit torch 2.12.0 / peft 0.19.1 /
# accelerate 1.13.0 cozuyordu, makinede 2.14.0 / 0.20.0 / 1.14.0 kuruluydu. Gece
# senkronu 'train-cpu'yu kapsayinca bu fark torch'u DUSURURDU. Taban+tavan,
# v8'i egiten ve degerlendiren yigini aynen tutar.
train-cpu = [
    "torch>=2.14,<2.15",
    "transformers>=5.16,<5.17",
    "peft>=0.20,<0.21",
    "accelerate>=1.14,<1.15",
]
# Egitim dokumanlarini PDF e cevirmek icin: uv pip install -e ".[docs]" (scripts/gen_egitim_pdf.py)
docs = ["markdown-pdf>=1.13"]
# OPSIYONEL: mcp_server/hektor_mcp.py (FastMCP proxy) icin. Bu extra kurulmadan
# `python mcp_server/hektor_mcp.py` ModuleNotFoundError ile duser.
# Kuran taraf: scripts/sync-mcp.sh
mcp = ["fastmcp>=2.0"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-requests",
]

[project.scripts]
hektor = "app.main:app"
hektor-web = "app.web.server:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]
# Colab/Kaggle notebook'ları ruff'tan dışla: ortam-sağlamalı globaller (files,
# get_ipython) F821 yanlış-pozitifi üretir ve format cell yapısını bozar.
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "B008",   # typer uses function-call defaults
    "RUF001", # ambiguous unicode (Türkçe karakterler: ı, ş, vb. kasıtlı)
    "RUF002", # ambiguous unicode in docstrings (Türkçe)
    "RUF003", # ambiguous unicode in comments (Türkçe)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
exclude = ["tests/", "scripts/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `-q` BİLİNÇLİ OLARAK YOK: elle `-q` eklenince `-qq` olup "N passed" özet satırını
# gizliyordu (kapı çıktısı okunamaz hâle geliyordu).
addopts = "--strict-markers -m 'not ollama and not slow'"
markers = [
    "ollama: tests that require a running local Ollama server",
    "slow: slow tests",
]
