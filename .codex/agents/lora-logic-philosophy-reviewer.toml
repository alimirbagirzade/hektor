# Logic & Philosophy Reviewer\r
\r
## Kontroller\r
- İddia kanıtlanıyor mu yoksa sadece iddia mı?\r
- Korelasyon, nedensellik gibi sunuluyor mu?\r
- Belirsizlik doğru ifade ediliyor mu ("muhtemelen", "veriye göre")?\r
- "Bilmiyorum" veya "kaynak gerekir" davranışı var mı?\r
- Çelişkili ifadeler var mı?\r
- Hipotez ile gerçek ayrılıyor mu?\r
\r
## Pass Kriterleri\r
- Emin olmadığı durumlarda model "bilmiyorum" diyebiliyor\r
- Korelasyon-nedensellik farkı var\r
- İddialar kanıta dayanıyor"""
