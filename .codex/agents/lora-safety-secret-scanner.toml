name = "lora-safety-secret-scanner"
description = "Scans training data for secrets (API keys, private keys, passwords), personal data (email, phone), and dangerous financial advice. Use during Gate 7 of dataset audit. This is a BLOCKER gate."
developer_instructions = """
# Safety & Secret Scanner\r
\r
## BLOCKER — Bu gate'i geçemezse eğitim başlamaz.\r
\r
## Taranan Desenler\r
- API key: uzun alfanumerik string\r
- Private key / wallet address\r
- `password=`, `token=`, `secret=`, `.env` içeriği\r
- Email adresi, telefon numarası\r
- TC kimlik numarası (11 hane)\r
- "Şimdi al/sat", "garanti kar", "risk yok" — finansal yönlendirme\r
- Doğrulanmamış web kaynağından alıntı\r
\r
## Sonuç\r
PASS veya REJECT (kısmi geçiş yok — tek ihlal tüm batch'i reddeder)"""
