# Hektor — Automation Manifest (Phase 0)
#
# Denetimde (audit) bulunan TÜM runtime-agent benzeri bileşenlerin tek,
# bildirimsel kaynağı. `app/agents/runtime/registry.py` bunu okur.
#
# Bu dosya BELGE + KEŞİF kaydıdır: çalışma zamanında davranışı ZORLAMAZ (Phase 1
# yalnız gözlem). Onay/durdurma zorlaması Phase 2 supervisor/approvals işidir.
#
# autonomy ∈ {manual, semi_auto, autonomous, requires_approval, dangerous_without_approval}
#
# GÜVENLİK DONDURMA NOTU: `dangerous: true` veya `approval_required: true` olan
# hiçbir ajan, Phase 2 supervisor/approval gelene kadar GÖZETİMSİZ döngüde
# çalıştırılmamalıdır (özellikle gerçek LoRA eğitimi + adapter terfisi).

version: 1
phase: 2  # gözlem + kontrol düzlemi (supervisor / approvals / executor) devrede

agents:
  - agent_id: auto-lora-pipeline
    name: Auto-LoRA Pipeline
    file: app/lora/auto_pipeline.py
    entrypoint: AutoLoRAPipeline.check_and_prepare / start_training / promote_to_production / background_loop
    trigger: "web /api/auto-lora/* + asyncio background_loop"
    autonomy: autonomous
    dangerous: true
    default_enabled: true
    writes:
      - storage/auto_lora_state.json
      - "sqlite: eval_history"
      - "sqlite: adapters (registry)"
      - models/adapters/  # eğitim çıktısı (yalnız onaylı eğitimde)
    reads:
      - "sqlite: knowledge_cards (approved count)"
      - evals/*.jsonl
      - reports/evals/
    safety_gates:
      - "start_training yalnız READY_TO_TRAIN + tek unattended politika yetkisiyle"
      - "promote_to_production yalnız EVAL_PASSED + tek unattended politika yetkisiyle"
      - "regresyon → EVAL_FAILED (terfi engellenir)"
      - "STOP_ALL bütün eğitim/terfi yollarından üstündür"
    approval_required: false
    stop_method: "/api/auto-lora/reset; detached eğitim için storage/STOP_ALL (+ engine_procs.terminate_all)"
    status_location: storage/auto_lora_state.json
    known_failure_modes:
      - "torch/peft yoksa → EVAL_SKIPPED"
      - "detached eğitim ölürse → TRAIN_FAILED"
      - "state dosyası bozuksa sessiz IDLE"

  - agent_id: training-orchestrator
    name: Training Orchestrator
    file: app/orchestration/orchestrator.py
    entrypoint: TrainingOrchestrator.start / step / run_until_blocked / recover_stale
    trigger: "CLI `orchestrate-*` + (Phase 2) web /api/orchestration/*"
    autonomy: autonomous
    dangerous: false  # koordinatör salt-okuma yürütür; gerçek eğitim auto-lora'ya delege
    default_enabled: false
    writes:
      - "sqlite: orchestration_runs / orchestration_stages / orchestration_events"
    reads:
      - data/lora_sft/lora_sft.jsonl
      - "sqlite: approvals (taze onay durumu)"
      - storage/STOP_ALL
    safety_gates:
      - "deep-hunt aşaması hunt_ack olmadan blocked (Kademe-2 ZORUNLU — CLAUDE.md)"
      - "approval aşaması tek UnattendedTrainingPolicy kararını kullanır"
      - "train yürütmesi tek sahip Auto-LoRA hattına HANDOFF edilir"
      - "STOP_ALL aktifken preflight/approval blocked"
      - "checkpoint+resume: tamamlanan aşama tekrar koşmaz (session-limit'e dayanıklı)"
    approval_required: false
    stop_method: "hektor orchestrate-recover (stale running → failed); cancel(run_id)"
    status_location: "sqlite: orchestration_runs"
    known_failure_modes:
      - "delege istisnası → aşama failed + koşu failed (sessiz yutma yok)"
      - "panic-recovery yoksa detached çöküşünde aşama 'running' asılı kalabilir"
      - "data-gate NO-GO veya veri yoksa blocked/failed (eğitim ilerlemez)"

  - agent_id: orchestration-autodrive
    name: Orchestration AutoDriver (claude -p)
    file: app/orchestration/driver.py
    entrypoint: AutoDriver.drive
    trigger: "CLI `orchestrate-autodrive` + web POST /api/orchestration/autodrive/{run_id}"
    autonomy: autonomous
    dangerous: false  # deep-hunt'ı sürer; eğitim yetkisini merkezi politika verir
    default_enabled: false
    writes:
      - "sqlite: orchestration_events (otonom sürüş olayları)"
      - "sqlite: orchestration_runs (hunt_ack=true, PASS sonrası)"
    reads:
      - "subprocess: claude -p (abonelik CLI; API key DEĞİL)"
    safety_gates:
      - "execute=False varsayılan: spawn YOK, yalnız komut döner (Kural 8 deseni)"
      - "spawn yalnız execute=True + `claude` PATH'te (claude_available)"
      - "claude -p promptu SALT-RAPOR (kod/git/eğitim YASAK); weekly-bug-scan deseni"
      - "deep-hunt PASS → merkezi eğitim politikası + Auto-LoRA handoff"
      - "FAIL/belirsiz verdict → deep-hunt bloklu kalır (eğitim ilerlemez)"
      - "argv listesi (shell=False) → kabuk enjeksiyonu yok; adapter/profile regex-kalıplı"
    approval_required: false
    stop_method: "koşu cancel(run_id); eğitim için global STOP_ALL"
    status_location: "sqlite: orchestration_runs / orchestration_events"
    known_failure_modes:
      - "claude PATH'te yoksa 503/early-return (spawn yok)"
      - "spawn/timeout istisnası → deep-hunt bloklu kalır, koşu çökmez"
      - "verdict satırı yoksa güvenli tarafta FAIL"

  - agent_id: echo-feedback
    name: Echo Feedback Loop
    file: app/feedback/echo.py
    entrypoint: EchoCollector.record / approve / export_approved
    trigger: "CLI `feedback-*` + web /api/feedback/*"
    autonomy: semi_auto
    dangerous: false  # yalnız ADAY üretir; eğitim başlatmaz, kanonik veriye dokunmaz
    default_enabled: false
    writes:
      - "sqlite: feedback_corrections"
      - data/feedback/feedback_sft.jsonl  # AYRI aday dosya (lora_sft.jsonl DEĞİL)
    reads:
      - "sqlite: feedback_corrections"
    safety_gates:
      - "submit'te Kural-1 zehir filtresi (garanti/kesinlik dili → anında reddedilir)"
      - "onay anında güvenlik tekrar kontrol (kayıt sonrası düzenleme savunması)"
      - "export AYRI aday dosyaya yazar; kanonik lora_sft.jsonl'e OTO-MERGE YOK (Kural 8)"
      - "boş soru/düzeltme reddedilir (sahte 'kabul' yok)"
    approval_required: false
    stop_method: "—; salt aday üretir (eğitim ayrı, onay-kapılı)"
    status_location: "sqlite: feedback_corrections"
    known_failure_modes:
      - "düzeltme zehri submit/approve'da reddedilir → exported'a geçmez"
      - "export aday dosyası yine pretrain-gate + audit'ten geçmeli (oto-eğitim yok)"

  - agent_id: sentinel-monitor
    name: Sentinel (Nöbetçi) — Sağlık Monitörü
    file: app/monitoring/sentinel.py
    entrypoint: Sentinel.run / history
    trigger: "CLI `sentinel` + web /api/sentinel/* (14·NÖBETÇİ sekmesi)"
    autonomy: semi_auto
    dangerous: false  # SALT-OKUMA rapor; hiçbir şeyi durdurmaz/başlatmaz/mutasyona uğratmaz
    default_enabled: false
    writes:
      - "sqlite: sentinel_checks (geçmiş; keep_last=1000 budamalı)"
    reads:
      - "Ollama /api/tags (LocalLLM.available)"
      - "http://127.0.0.1:8765/ (web canlılık)"
      - storage/train_status.json + logs/train-full-err.log (eğitim durumu)
      - "Windows Get-ScheduledTask (Hektor*/Achilles* görevleri — SALT SORGU, autostart probe'u)"
      - "sqlite: orchestration_stages (stale-peek, MUTASYONSUZ)"
      - storage/STOP_ALL
      - "disk kullanımı + PRAGMA quick_check + feedback pending sayısı"
    safety_gates:
      - "tüm probe'lar salt-okuma; recover/stop/start ASLA çağrılmaz (yalnız öneri metni)"
      - "probe istisnası skip'e düşer (nöbetçi düşmez; sessiz yutma yok — detayda hata)"
      - "contention probe'u DANIŞMAN Resource Negotiator: eğitimi DURAKLAMAZ (detached
        PEFT'te güvenli resume yok), yalnız CPU çekişmesini raporlar"
      - "geçmiş yazılamazsa canlı rapor yine döner (best-effort persist)"
      - "autostart probe'u yalnız Get-ScheduledTask SORGULAR; görev kaydetmez/silmez —
        onarım insanın çalıştırdığı `start-server.ps1 -Install/-Repair` işidir"
    approval_required: false
    stop_method: "—; anlık rapor (arka plan döngüsü yok, UI/CLI çağrısıyla koşar)"
    status_location: "sqlite: sentinel_checks"
    known_failure_modes:
      - "Ollama kapalıyken llm=fail (normal sinyal, nöbetçi hatası değil)"
      - "web sunucu kapalıyken web=warn (CLI onsuz çalışır)"
      - "modül import edilemezse ilgili probe skip"
      - "autostart: Windows dışında skip; PowerShell çağrılamazsa skip (nöbetçi düşmez)"
      - "autostart=fail 2026-09-07'de GERÇEKLEŞTİ: achilles2.0→hektor yeniden adlandırması
        Windows görevlerini taşımadı; 3 eski görev SİLİNMİŞ yolu gösteriyordu ve
        HektorTrainingWatchdog hiç kayıtlı değildi → eğitim çökme-kurtarması YOKTU, ama
        görevler listede 'Ready' göründüğü için sessizdi. Bu probe o sınıfı yakalar."

  - agent_id: self-healing-controller
    name: Self-Healing Controller (Tamir Döngüsü)
    file: app/monitoring/self_heal.py
    entrypoint: SelfHealingController.background_loop / run_once
    trigger: "web lifespan background loop (60s)"
    autonomy: autonomous
    dangerous: false
    default_enabled: true
    writes:
      - storage/self_heal_state.json
      - "sqlite: orchestration state (yalnız stale recover runbook)"
    reads:
      - "Sentinel health probes"
      - storage/rag_learning_state.json
    safety_gates:
      - "3 ardışık hata olmadan tamir yok"
      - "yalnız açık allow-list idempotent runbook; shell/git/kod değişikliği yok"
      - "tamir sonrası probe ile doğrulama"
      - "başarısızlıkta exponential backoff + circuit breaker"
      - "eğitim başlatma, approval ve model terfisi yok"
    approval_required: false
    stop_method: "storage/self_heal_state.json enabled=false"
    status_location: storage/self_heal_state.json
    known_failure_modes:
      - "runbook başarısızsa cooldown büyür; sistem retry storm üretmez"

  - agent_id: training-guardian
    name: Training Guardian (Checkpoint ve Otomatik Tamir)
    file: scripts/training-watchdog.ps1
    entrypoint: HektorTrainingWatchdog scheduled task / PEFT auto-resume
    trigger: "Windows Task Scheduler (5 dk loop)"
    autonomy: autonomous
    dangerous: false
    default_enabled: true
    writes:
      - storage/train_status.json
      - models/adapters/*/checkpoint-*
      - "subprocess: exactly one detached LoRA training tree"
    reads:
      - logs/train-full-err.log
      - storage/train_status.json
      - storage/STOP_ALL
    safety_gates:
      - "global mutex + fresh-log heartbeat duplicate spawn'i engeller"
      - "web restart eğitim süreçlerine dokunmaz"
      - "her 25 adım checkpoint; son 3 checkpoint korunur"
      - "çökmede son checkpoint'ten otomatik resume"
      - "STOP_ALL her zaman üstün"
    approval_required: false
    stop_method: "storage/STOP_ALL veya scripts/start-train.ps1 -Stop"
    status_location: "logs/train-full-err.log + models/adapters/*/checkpoint-*"
    known_failure_modes:
      - "makine kapanırsa ilk görev turunda yeniden başlar; en fazla 24 adım kayıp"

  - agent_id: unattended-supervisor
    name: Unattended Supervisor (Kesintisiz İşletim)
    file: app/orchestration/unattended_supervisor.py
    entrypoint: UnattendedSupervisor.background_loop / reconcile_once
    trigger: "web lifespan reconciliation loop (60s)"
    autonomy: autonomous
    dangerous: false
    default_enabled: true
    writes:
      - storage/unattended_supervisor_state.json
      - "sqlite: orchestration runs/events"
      - "subprocess: one hardened subscription motor"
    reads:
      - "engine_procs live motor registry"
      - "sqlite: latest orchestration run"
      - storage/STOP_ALL
    safety_gates:
      - "tek canlı motor; duplicate spawn yok"
      - "STOP_ALL her zaman üstün"
      - "yalnız hardened drive profili"
      - "başarısızlıkta exponential backoff + circuit breaker"
      - "sunucu restart sonrası kalıcı state'ten reconcile"
    approval_required: false
    stop_method: "storage/unattended_supervisor_state.json enabled=false veya STOP_ALL"
    status_location: storage/unattended_supervisor_state.json
    known_failure_modes:
      - "abonelik/CLI erişilemezse backoff büyür; retry storm oluşmaz"

  - agent_id: rag-learning-loop
    name: RAG Öğrenme ve Hafıza Hattı
    file: app/research/rag_learning_loop.py
    entrypoint: RagLearningLoop.run_one_cycle / background_loop / trigger_once_bg
    trigger: "asyncio background_loop (15s heartbeat) + web /api/rag-loop/* + motor MCP run-once"
    autonomy: autonomous
    dangerous: false
    default_enabled: false
    writes:
      - storage/rag_learning_state.json
      - "sqlite: papers, chunks, knowledge_cards, paper_comprehension (builder'lar üzerinden)"
    reads:
      - "sqlite: arxiv_saved_queries (auto_ingest), papers, knowledge_cards"
    safety_gates:
      - "LoRA eğitimi sürerken DURAKLAR (_training_running → stage=paused_training)"
      - "is_substantive_card içerik kapısı (dejenerasyon kartlarını reddeder)"
      - "tur başına bütçeler (cards_per_cycle vb. clamp'li)"
      - "asyncio lock — eşzamanlı tur yok"
      - "motor yalnız status + run-once görür; kalıcı enable/config MCP'de kapalı"
      - "varsayılan KAPALI (enabled=false)"
    approval_required: false
    stop_method: "/api/rag-loop/enable false (+ enabled state'i kalıcı)"
    status_location: storage/rag_learning_state.json
    known_failure_modes:
      - "öğe-başı hatalar yakalanır, tur devam eder"
      - "tur istisnası → stage=error + last_error"
      - "eşzamanlı tur reddedilir"

  - agent_id: research-orchestrator
    name: Research Orchestrator
    file: app/research/orchestrator.py
    entrypoint: ResearchOrchestrator.run
    trigger: "CLI `research` / web /api/research/run"
    autonomy: semi_auto
    dangerous: false
    default_enabled: false
    writes:
      - "sqlite: research_sessions"
    reads:
      - "OHLCV (data/market/raw/* veya sentetik)"
      - "sentez motoru / makaleler"
    safety_gates:
      - "look-ahead güvenli backtest (shift(1)), L5 için tek backtest yeniden kullanılır"
      - "IR doğrulama + example_ir fallback"
      - "verdict != pass → 'aday', 'hazır' değil (CLAUDE.md Kural 2)"
      - "novelty dedup (_signature)"
    approval_required: false
    stop_method: "senkron çağrı — iptal yok (Phase 2 task iptali)"
    status_location: "sqlite: research_sessions + agent_runs (Phase 1)"
    known_failure_modes:
      - "sentez None → döngü kırılır"
      - "LLM çevrimdışı → reflection no-op"

  - agent_id: literature-scout
    name: Literatür Keşif Ajanı (LoRA/RAG/RLM/mat-fizik)
    file: app/research/literature_scout.py
    entrypoint: run_scout
    trigger: "CLI `lit-scan` / scripts/install-literature-scout-task.ps1 (Task Scheduler, günlük)"
    autonomy: semi_auto
    dangerous: false
    default_enabled: false
    writes:
      - "docs/egitim/<konu>-watchlist.md (rag|lora|rlm|math-physics)"
      - "gelen kutusu: HEKTOR_SCOUT_INBOX_DIR (yoksa data/literature_inbox/) — PDF + BULUNANLAR.md"
    reads:
      - "arXiv (ağ, enjekte edilebilir searcher)"
      - docs/egitim/rag-watchlist.md
    safety_gates:
      - "yalnız KEŞİF: indirir + listeler — RAG'a ingest YOK, eğitim YOK (Kural 8)"
      - "LLM/API kotası kullanmaz (arXiv genel API + offline anahtar-kelime skoru)"
      - "PDF doğrulaması (%PDF) — bozuk/HTML içerik diske yazılmaz"
      - "idempotent: var olan dosya yeniden indirilmez, aday dedup edilir"
      - "çevrimdışı-güvenli (ağ hatası → boş rapor, çökme yok)"
    approval_required: false
    stop_method: "Task Scheduler görevini kaldır (Hektor-LiteratureScout)"
    status_location: "gelen kutusu BULUNANLAR.md + docs/egitim/<konu>-watchlist.md"
    known_failure_modes:
      - "arXiv erişilemez → boş rapor"
      - "PDF-olmayan içerik atlanır (diske yazılmaz)"

  - agent_id: rag-trend-scanner
    name: RAG Trend Scanner
    file: app/research/rag_trend_scanner.py
    entrypoint: scan_rag_trends / append_candidates
    trigger: "CLI `rag-scan` / scripts/rag-research-loop.ps1 -Mode Scan (Task Scheduler)"
    autonomy: semi_auto
    dangerous: false
    default_enabled: false
    writes:
      - docs/egitim/rag-watchlist.md
    reads:
      - "arXiv (ağ, enjekte edilebilir searcher)"
      - docs/egitim/rag-watchlist.md
    safety_gates:
      - "yalnız rapor/biriktirme — ingest/train/push YOK"
      - "çevrimdışı-güvenli (ağ hatası → boş, çökme yok)"
      - "deterministik skorlama + idempotent dedup"
    approval_required: false
    stop_method: "Task Scheduler görevini kaldır (Hektor-RAG-Scan)"
    status_location: "docs/egitim/rag-watchlist.md + logs/rag-scan-*.log"
    known_failure_modes:
      - "sorgu başına arama hatası yutulur"
      - "boş sonuç → boş liste"

  - agent_id: reflection-agent
    name: Reflection Agent
    file: app/research/reflection_agent.py
    entrypoint: ReflectionAgent.reflect
    trigger: "ResearchOrchestrator tarafından (başarısız iterasyonda)"
    autonomy: manual
    dangerous: false
    default_enabled: false
    writes: []
    reads:
      - "indikatör + backtest metrikleri + verdict"
    safety_gates:
      - "LLM fmt=json, katı regex/JSON parse (eval/exec YOK — Kural 5)"
      - "strategy_ir yoksa None döner"
    approval_required: false
    stop_method: "yok (orchestrator içi advisory adım)"
    status_location: "orchestrator log + research_sessions"
    known_failure_modes:
      - "LLM erişilemez / bozuk JSON → None (graceful)"

  - agent_id: paper-mastery-agent
    name: Paper Mastery Agent
    file: app/learning/paper_mastery_agent.py
    entrypoint: PaperMasteryAgent.run / LearningQueue.run_next / run_all
    trigger: "CLI `mastery-run` / `mastery-queue` / web"
    autonomy: semi_auto
    dangerous: false
    default_enabled: false
    writes:
      - "sqlite: paper_mastery_tests/questions/answers/scores, paper_status_history"
      - reports/papers/mastery/*.json + *.md
    reads:
      - "sqlite: papers, knowledge_cards"
    safety_gates:
      - "rapor yazımı başarısız olsa bile skor/durum korunur"
      - "skor eşikleri → durum (deterministik)"
    approval_required: false
    stop_method: "Ctrl-C / kuyruğu boşalt (manuel)"
    status_location: "sqlite: MasteryStore + reports/papers/mastery/"
    known_failure_modes:
      - "istisna → finish_test(0,0) + status=failed"
      - "rapor dosyası kilidi (Windows os error 32) best-effort"

  - agent_id: status-manager
    name: Status Manager
    file: app/learning/status_manager.py
    entrypoint: StatusManager.update / status_from_score / get_current / get_history
    trigger: "PaperMasteryAgent tarafından çağrılır"
    autonomy: manual
    dangerous: false
    default_enabled: false
    writes:
      - "sqlite: paper_status_history"
    reads:
      - "sqlite: MasteryStore (mevcut durum/skor)"
    safety_gates:
      - "VALID_STATUSES whitelist (15 durum)"
      - "skor→durum eşikleri"
    approval_required: false
    stop_method: "yok (yardımcı)"
    status_location: "sqlite: MasteryStore"
    known_failure_modes:
      - "MasteryStore'a bağımlı; iç try/except yok (çağıran ele alır)"

  - agent_id: lora-control-plane
    name: LoRA Control Plane
    file: app/lora/control_plane.py
    entrypoint: LoRAControlPlane.run_full / run_audit
    trigger: "CLI `lora-audit` / auto-lora-pipeline tarafından"
    autonomy: semi_auto
    dangerous: false
    default_enabled: false
    writes:
      - reports/lora/audit_report.md
      - data/lora_sft/  # dataset split (Gate 8)
    reads:
      - "sqlite: knowledge_cards (approved)"
    safety_gates:
      - "boş/içeriksiz kart filtresi (_card_text)"
      - "Gate 7 safety scanner = BLOCKER"
      - "herhangi gate başarısız → PipelineReport.passed=False (eğitim BAŞLATMAZ)"
    approval_required: false
    stop_method: "yok (senkron audit)"
    status_location: "reports/lora/ + PipelineReport"
    known_failure_modes:
      - "gate fonksiyonu istisnası → çağıran yakalar"
      - "boş kart havuzu → passed olabilir ama eğitim ayrı kapıda"

  - agent_id: adapter-eval
    name: Adapter Evaluator
    file: app/training/adapter_eval.py
    entrypoint: evaluate_adapter
    trigger: "auto-lora-pipeline._run_eval / CLI `lora-eval`"
    autonomy: semi_auto
    dangerous: false
    default_enabled: false
    writes:
      - reports/evals/adapter_eval_*.json
    reads:
      - models/adapters/<name>
      - evals/*.jsonl
    safety_gates:
      - "GERÇEK base-vs-adapter (PEFT yükler), greedy/deterministik üretim"
      - "regresyon → reject; dejenerasyon cezası (v5 dersi)"
      - "TERFİ ETMEZ (yalnız verdict)"
    approval_required: false
    stop_method: "yok (senkron, ağır)"
    status_location: reports/evals/
    known_failure_modes:
      - "torch/transformers/peft yoksa → ImportError → EVAL_SKIPPED"
      - "CPU'da çok yavaş"

  - agent_id: dataset-quality-gate
    name: Dataset Quality Gate (pretrain-gate #3)
    file: app/training/dataset_quality.py
    entrypoint: audit_dataset
    trigger: "python'dan (CLI komutu KAYIP — Phase 2/ileride re-add)"
    autonomy: semi_auto
    dangerous: false
    default_enabled: false
    writes:
      - reports/evals/pretrain_gate.json  # çağıran yazar
    reads:
      - "birleşik SFT JSONL satırları + opsiyonel disiplin havuzu"
    safety_gates:
      - "GO/NO-GO: garanti-vaadi zehiri → NO-GO"
      - "açılış-ezberi (>%40 tek bigram açılış) → NO-GO (v5 mekanizması)"
      - "eğitim BAŞLATMAZ; deterministik"
    approval_required: false
    stop_method: "yok (saf rapor)"
    status_location: reports/evals/pretrain_gate.json
    known_failure_modes:
      - "bozuk JSONL satırı sessiz atlanır"

